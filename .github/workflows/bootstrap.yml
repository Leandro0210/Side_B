name: Importar proyecto SIDE B
on:
  push:
    branches:
      - feat/side-b-gradio-auditoria-v05
permissions:
  contents: write
jobs:
  importar:
    if: github.event.head_commit.message == 'chore: preparar importacion segura Side B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer proyecto seguro
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.').resolve()
          with zipfile.ZipFile('SIDE_B_GitHub_Seguro.zip') as z:
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  name = entry.filename
                  if not name.startswith('SIDE_B/'):
                      raise ValueError(f"Unexpected ZIP prefix: {name}")
                  relative = pathlib.PurePosixPath(name.removeprefix('SIDE_B/'))
                  if not relative.parts or '..' in relative.parts or relative.is_absolute():
                      raise ValueError(f"Unsafe ZIP path: {name}")
                  dst = root.joinpath(*relative.parts)
                  if not dst.resolve().is_relative_to(root):
                      raise ValueError(f"Outside repo: {name}")
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(z.read(entry))
          print("SIDE B source files extracted.")
          PY
      - name: Publicar archivos
        run: |
          rm -f SIDE_B_GitHub_Seguro.zip .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar Gradio y auditoria etica SIDE B v0.5"
          git push
