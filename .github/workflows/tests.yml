name: Pruebas SIDE B
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python validar_integral_side_b.py
      - run: python side_b_catalog_quality.py
      - run: python side_b_risk_register.py
      - run: python side_b_ethics_closure.py
